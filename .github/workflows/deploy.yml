name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static site
        run: |
          BASE="${SITE_BASE_URL:-https://ivanweissvanderpol.github.io}"
          python3 scripts/build_site.py --content content --out site --base-url "$BASE"

      - name: Structural + SEO verification
        run: |
          BASE="${SITE_BASE_URL:-https://ivanweissvanderpol.github.io}"
          python3 scripts/verify_site.py --site site --base-url "$BASE"

      - name: GEO / AEO content lint
        run: python3 scripts/geo_lint.py site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
